name: brew test-bot
on:
  push:
    branches:
      - main
  pull_request:
env:
  HOMEBREW_CORE_GIT_REMOTE: "https://github.com/autobrew/homebrew-sonoma"
  HOMEBREW_NO_INSTALL_FROM_API: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_FAKE_MACOS: "14.8.4"
  HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
  MACOSX_DEPLOYMENT_TARGET: '11.0'
jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        arch: [intel, arm]
        sdk: ['14.0']
    runs-on: ${{ matrix.arch == 'arm' && 'macos-15' || 'macos-15-intel' }}
    steps:

      # Must run before any brew command that loads a core formula: with
      # HOMEBREW_CORE_GIT_REMOTE set, brew only treats homebrew/core as trusted
      # while the checkout origin matches that remote, and `brew trust
      # homebrew/core` refuses to record official taps.
      - name: Reset homebrew-core to sonoma snapshot
        run: |
          cd "$(brew --repo homebrew/core)"
          git remote set-url origin "$HOMEBREW_CORE_GIT_REMOTE"
          git clean -fxd
          git fetch origin main
          git reset --hard origin/main

      - name: Install MacOS SDK
        if: github.event_name == 'pull_request'
        run: |
          sdk=${{matrix.sdk}}
          cd /Library/Developer/CommandLineTools/SDKs/
          sudo rm -Rf -- *
          sudo curl -OL https://github.com/joseluisq/macosx-sdks/releases/download/${sdk}/MacOSX${sdk}.sdk.tar.xz
          sudo tar xf MacOSX${sdk}.sdk.tar.xz
          sudo rm -f MacOSX${sdk}.sdk.tar.xz
          sudo ln -sf MacOSX${sdk}.sdk MacOSX.sdk
          ls -l
          sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Prepare fake MacOS environment
        if: github.event_name == 'pull_request'
        run: |
          # Unset GITHUB_ACTIONS so brew's "configuration files have not been
          # removed" notes print as plain warnings instead of ::warning::
          # annotations cluttering the run summary.
          brew list --formula | xargs env -u GITHUB_ACTIONS brew remove
          # Brew deletes MACOSX_DEPLOYMENT_TARGET from the build environment
          # (SANITIZED_VARS in shared.rb); removing it from that list lets our
          # job-level value reach the compilers, so formulae build for macOS
          # ${{ matrix.sdk }} unless they override it in their install method.
          sed -i.bak 's|MACOSX_DEPLOYMENT_TARGET||g' "$(brew --repo)/Library/Homebrew/extend/ENV/shared.rb"

      # Replaces Homebrew/actions/setup-homebrew: we use the runner's preinstalled
      # brew instead of updating to latest Homebrew/brew main, which keeps the brew
      # version as frozen as the pinned core tap. The action also blanked
      # HOMEBREW_NO_INSTALL_FROM_API via GITHUB_ENV (overriding the job env),
      # silently re-enabling the JSON API and bypassing the pin.
      - name: Set up taps
        run: |
          # The intel runner image preinstalls third-party taps (aws/tap,
          # hashicorp/tap) whose formulae fail to load on current brew and spam
          # the run with warning/error annotations; drop them before brew scans
          # taps. All their packages were already uninstalled above.
          find "$(brew --repo)/Library/Taps" -mindepth 1 -maxdepth 1 -type d ! -name homebrew -exec rm -rf {} +
          brew tap autobrew/cran
          brew trust autobrew/cran || true
          git -C "$(brew --repo autobrew/cran)" fetch origin "$GITHUB_SHA"
          git -C "$(brew --repo autobrew/cran)" checkout --force "$GITHUB_SHA"

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup || true

      - run: brew test-bot --only-tap-syntax || true
        if: matrix.sdk == '14.0'

      - run: brew test-bot --only-formulae --skip-dependents
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.arch }}_${{ matrix.sdk }}
          path: '*.bottle.*'
